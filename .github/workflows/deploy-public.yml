name: Deploy public MHP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mhp-public-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the public frontend and release archive
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          python3 -B deploy/build_github_release.py
      - name: Configure the production SSH identity
        env:
          MHP_SSH_PRIVATE_KEY: ${{ secrets.MHP_SSH_PRIVATE_KEY }}
          MHP_SSH_KNOWN_HOSTS: ${{ secrets.MHP_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$MHP_SSH_PRIVATE_KEY"
          test -n "$MHP_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MHP_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MHP_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and apply the verified release bundle
        env:
          MHP_DEPLOY_HOST: ${{ secrets.MHP_DEPLOY_HOST }}
          MHP_DEPLOY_USER: ${{ secrets.MHP_DEPLOY_USER }}
          MHP_DEPLOY_PATH: ${{ secrets.MHP_DEPLOY_PATH }}
        run: |
          test -n "$MHP_DEPLOY_HOST"
          test -n "$MHP_DEPLOY_USER"
          test -n "$MHP_DEPLOY_PATH"
          archive=data/github-release/mhp-release.tar.gz
          sha=$(sha256sum "$archive" | awk '{print $1}')
          host="$MHP_DEPLOY_USER@$MHP_DEPLOY_HOST"
          script="/tmp/mhp-apply-$sha.sh"
          log="/tmp/mhp-release-$sha.log"
          status="/tmp/mhp-release-$sha.status"
          scp -o BatchMode=yes "$archive" "$host:/tmp/mhp-release-$sha.tar.gz"
          scp -o BatchMode=yes deploy/apply_github_release.sh "$host:$script"
          ssh -o BatchMode=yes "$MHP_DEPLOY_USER@$MHP_DEPLOY_HOST" \
            "rm -f '$status' '$log'; chmod 700 '$script'; nohup env MHP_RELEASE_SHA='$sha' MHP_DEPLOY_PATH='$MHP_DEPLOY_PATH' bash '$script' >'$log' 2>&1 < /dev/null &"
          for attempt in $(seq 1 180); do
            result=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$host" "cat '$status' 2>/dev/null || true" || true)
            if [ "$result" = success ]; then
              ssh -o BatchMode=yes "$host" "rm -f '$script' '$log' '$status'"
              exit 0
            fi
            if [ "$result" = failed ]; then
              ssh -o BatchMode=yes "$host" "tail -200 '$log'; rm -f '$script' '$status'" || true
              exit 1
            fi
            sleep 10
          done
          ssh -o BatchMode=yes "$host" "tail -200 '$log'" || true
          exit 1
